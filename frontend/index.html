<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ML Experiment Auditor — Evidence-Driven Pipeline Auditing</title>
    <meta name="description" content="Evidence-driven automated auditing and repair of machine learning evaluation pipelines. Detect data leakage, audit evaluation integrity, and automatically fix ML pipelines.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">ML Auditor</span>
                <span class="brand-sub">Evidence-Driven Framework</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-page="datasets" onclick="navigate('datasets')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                <span>Dataset Library</span>
            </a>
            <a href="#" class="nav-item" data-page="experiment" onclick="navigate('experiment')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v11l-3 3-3-3z"/><path d="M6 21h12"/><path d="M3 21l3-3"/><path d="M21 21l-3-3"/></svg>
                <span>New Experiment</span>
            </a>
            <a href="#" class="nav-item" data-page="findings" onclick="navigate('findings')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <span>Audit Findings</span>
            </a>
            <a href="#" class="nav-item" data-page="comparison" onclick="navigate('comparison')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Before / After</span>
            </a>
            <a href="#" class="nav-item" data-page="benchmark" onclick="navigate('benchmark')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                <span>Benchmark Lab</span>
            </a>
            <a href="#" class="nav-item" data-page="reports" onclick="navigate('reports')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-text">
                <span>Built for research</span>
                <span>All data is real</span>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content" id="mainContent">
        <!-- Pages will be rendered here -->
        <div id="page-dashboard" class="page active"></div>
        <div id="page-datasets" class="page"></div>
        <div id="page-experiment" class="page"></div>
        <div id="page-findings" class="page"></div>
        <div id="page-comparison" class="page"></div>
        <div id="page-benchmark" class="page"></div>
        <div id="page-reports" class="page"></div>
    </main>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <p class="loading-text" id="loadingText">Processing...</p>
        </div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/app.js"></script>
</body>
</html>
