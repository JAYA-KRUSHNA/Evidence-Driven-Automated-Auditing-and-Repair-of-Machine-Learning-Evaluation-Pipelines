<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal AI/ML Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

    /* ── Tokens ──────────────────────────────────────────────────────── */
    :root {
      --ease : cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --t    : 0.26s;
    }
    [data-theme="dark"], :root {
      --bg         : #07090f;
      --grid-line  : rgba(255,255,255,0.028);
      --glass      : rgba(13,17,30,0.60);
      --glass-b    : rgba(255,255,255,0.06);
      --txt        : #c8d0e8;
      --txt-bright : #ffffff;
      --txt-muted  : #48536e;
      --accent     : #6366f1;
      --accent-h   : #4f46e5;
      --accent-g   : rgba(99,102,241,0.30);
      --accent-s   : rgba(99,102,241,0.09);
      --cyan       : #06b6d4;
      --orb-a      : rgba(99,102,241,0.15);
      --orb-b      : rgba(6,182,212,0.08);
      --orb-c      : rgba(168,85,247,0.09);
      --shadow     : 0 32px 80px rgba(0,0,0,0.60), 0 0 0 1px rgba(255,255,255,0.05);
      --cta-glow   : 0 8px 40px rgba(99,102,241,0.46);
      --bar-bg     : rgba(8,10,18,0.78);
      --bar-b      : rgba(255,255,255,0.055);
      --foot-txt   : #232b42;
      --chip-bg    : rgba(99,102,241,0.08);
      --chip-b     : rgba(99,102,241,0.22);
      --badge-bg   : rgba(16,185,129,0.09);
      --badge-b    : rgba(16,185,129,0.22);
      --badge-txt  : #34d399;
      --tog-bg     : rgba(99,102,241,0.12);
      --tog-b      : rgba(99,102,241,0.30);
    }
    [data-theme="light"] {
      --bg         : #f1f4fa;
      --grid-line  : rgba(0,0,0,0.04);
      --glass      : rgba(255,255,255,0.72);
      --glass-b    : rgba(0,0,0,0.065);
      --txt        : #1e293b;
      --txt-bright : #0f172a;
      --txt-muted  : #64748b;
      --accent     : #4f46e5;
      --accent-h   : #4338ca;
      --accent-g   : rgba(79,70,229,0.26);
      --accent-s   : rgba(79,70,229,0.07);
      --cyan       : #0284c7;
      --orb-a      : rgba(99,102,241,0.09);
      --orb-b      : rgba(6,182,212,0.055);
      --orb-c      : rgba(168,85,247,0.06);
      --shadow     : 0 16px 48px rgba(15,23,42,0.11), 0 0 0 1px rgba(0,0,0,0.055);
      --cta-glow   : 0 6px 30px rgba(79,70,229,0.32);
      --bar-bg     : rgba(255,255,255,0.80);
      --bar-b      : rgba(0,0,0,0.07);
      --foot-txt   : #94a3b8;
      --chip-bg    : rgba(79,70,229,0.07);
      --chip-b     : rgba(79,70,229,0.18);
      --badge-bg   : rgba(5,150,105,0.08);
      --badge-b    : rgba(5,150,105,0.20);
      --badge-txt  : #059669;
      --tog-bg     : rgba(79,70,229,0.08);
      --tog-b      : rgba(79,70,229,0.28);
    }

    body {
      background: var(--bg);
      color: var(--txt);
      transition: background var(--t) var(--ease), color var(--t) var(--ease);
    }

    /* ── Background: dot-grid ────────────────────────────────────────── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, var(--grid-line) 1px, transparent 1px);
      background-size: 36px 36px;
      transition: background var(--t) var(--ease);
    }

    /* ── Orbs ────────────────────────────────────────────────────────── */
    .orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(88px); }
    .orb-1 { width: 580px; height: 580px; background: var(--orb-a); top: -150px; left: -100px;
              animation: d1 22s ease-in-out infinite alternate; }
    .orb-2 { width: 420px; height: 420px; background: var(--orb-b); bottom: -90px; right: 4%;
              animation: d2 18s ease-in-out infinite alternate; }
    .orb-3 { width: 320px; height: 320px; background: var(--orb-c); top: 42%; right: -60px;
              animation: d1 28s ease-in-out 3s infinite alternate-reverse; }
    @keyframes d1 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(26px,18px) scale(1.07); }
    }
    @keyframes d2 {
      from { transform: translate(0,0); }
      to   { transform: translate(-22px,-15px) scale(1.05); }
    }

    /* ── Top bar ─────────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: var(--bar-bg); border-bottom: 1px solid var(--bar-b);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
      animation: bar-in 0.5s var(--ease) both;
    }
    @keyframes bar-in {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-mark svg { width: 15px; height: 15px; }
    .brand-name {
      font-size: 13.5px; font-weight: 700; color: var(--txt-bright);
      letter-spacing: -0.015em; transition: color var(--t) var(--ease);
    }

    /* ── Toggle ──────────────────────────────────────────────────────── */
    .toggle-row { display: flex; align-items: center; gap: 8px; }
    .toggle-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500;
      color: var(--txt-muted); text-transform: uppercase; letter-spacing: 0.08em;
      transition: color var(--t) var(--ease); user-select: none;
    }
    .toggle-btn {
      background: none; border: none; padding: 0; cursor: pointer; outline: none;
      width: 42px; height: 23px; position: relative;
    }
    .tog-track {
      width: 42px; height: 23px; border-radius: 999px;
      background: var(--tog-bg); border: 1px solid var(--tog-b);
      transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
    }
    .tog-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.24s var(--ease), background var(--t) var(--ease);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    [data-theme="light"] .tog-thumb { transform: translateX(19px); }
    .i-moon, .i-sun { position: absolute; width: 8px; height: 8px; transition: opacity 0.18s; }
    .i-moon { opacity: 1; } .i-sun { opacity: 0; }
    [data-theme="light"] .i-moon { opacity: 0; }
    [data-theme="light"] .i-sun  { opacity: 1; }

    /* ── Page ────────────────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 72px 24px 60px;
    }

    /* ── Card ────────────────────────────────────────────────────────── */
    .card {
      background: var(--glass); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--glass-b); border-radius: 24px; box-shadow: var(--shadow);
      padding: 44px 42px 38px; max-width: 460px; width: 100%;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
      animation: card-rise 0.65s var(--ease) 0.1s both;
    }
    @keyframes card-rise {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Glyph ring + icon ───────────────────────────────────────────── */
    .glyph-wrap {
      position: relative; margin-bottom: 24px;
      animation: glyph-in 0.6s var(--spring) 0.3s both;
    }
    @keyframes glyph-in {
      from { opacity: 0; transform: scale(0.7) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .glyph-ring {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 1px solid rgba(99,102,241,0.18);
      animation: ring-pulse 3.5s ease-in-out infinite;
    }
    .glyph-ring-2 {
      position: absolute; inset: -20px; border-radius: 50%;
      border: 1px solid rgba(99,102,241,0.08);
      animation: ring-pulse 3.5s ease-in-out 0.6s infinite;
    }
    @keyframes ring-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.04); }
    }
    .glyph {
      width: 60px; height: 60px; border-radius: 15px;
      background: linear-gradient(140deg, var(--accent) 0%, var(--cyan) 100%);
      display: flex; align-items: center; justify-content: center;
      animation: glow-pulse 3.2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 24px var(--accent-g); }
      50%       { box-shadow: 0 0 52px var(--accent-g); }
    }
    .glyph svg { width: 28px; height: 28px; }

    /* ── Status badge ────────────────────────────────────────────────── */
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px;
      background: var(--badge-bg); border: 1px solid var(--badge-b);
      font-size: 11px; font-weight: 600; color: var(--badge-txt);
      letter-spacing: 0.04em; text-transform: uppercase;
      margin-bottom: 16px;
      animation: fade-up 0.5s var(--ease) 0.55s both;
    }
    .status-dot-anim {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--badge-txt);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Title word-reveal ───────────────────────────────────────────── */
    .title {
      font-size: 28px; font-weight: 800; color: var(--txt-bright);
      letter-spacing: -0.03em; line-height: 1.18;
      margin-bottom: 10px; overflow: hidden;
      transition: color var(--t) var(--ease);
    }
    .title .word {
      display: inline-block; overflow: hidden;
      padding-bottom: 2px;
    }
    .title .word span {
      display: inline-block;
      animation: word-reveal 0.55s var(--ease) both;
    }
    .title .word:nth-child(1) span { animation-delay: 0.65s; }
    .title .word:nth-child(2) span { animation-delay: 0.78s; }
    .title .word:nth-child(3) span { animation-delay: 0.91s; }
    .title .word:nth-child(4) span { animation-delay: 1.04s; }
    @keyframes word-reveal {
      from { opacity: 0; transform: translateY(100%); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Subtitle ────────────────────────────────────────────────────── */
    .sub {
      font-size: 13.5px; color: var(--txt-muted); line-height: 1.65;
      margin-bottom: 28px;
      animation: fade-up 0.55s var(--ease) 1.2s both;
      transition: color var(--t) var(--ease);
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Stat chips ──────────────────────────────────────────────────── */
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 30px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 13px; border-radius: 999px;
      background: var(--chip-bg); border: 1px solid var(--chip-b);
      font-size: 12px; font-weight: 600; color: var(--txt);
      transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
                  color var(--t) var(--ease), transform 0.2s var(--ease);
      animation: chip-pop 0.5s var(--spring) both;
    }
    .chip:hover { transform: translateY(-2px); }
    .chip:nth-child(1) { animation-delay: 1.35s; }
    .chip:nth-child(2) { animation-delay: 1.48s; }
    .chip:nth-child(3) { animation-delay: 1.61s; }
    @keyframes chip-pop {
      from { opacity: 0; transform: scale(0.85) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .chip-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 700; color: var(--accent);
    }

    /* ── Divider ─────────────────────────────────────────────────────── */
    .divider {
      width: 100%; height: 1px; background: var(--glass-b);
      margin-bottom: 24px;
      animation: fade-up 0.4s var(--ease) 1.7s both;
    }

    /* ── CTA ─────────────────────────────────────────────────────────── */
    .cta-wrap { width: 100%; animation: cta-in 0.55s var(--spring) 1.78s both; }
    @keyframes cta-in {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 15px 24px; border-radius: 13px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
      border: none; cursor: pointer; text-decoration: none;
      position: relative; overflow: hidden;
      box-shadow: var(--cta-glow);
      transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease),
                  transform 0.16s var(--ease);
    }
    /* shimmer sweep */
    .cta::before {
      content: '';
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      animation: shimmer 2.8s ease-in-out 2.5s infinite;
    }
    @keyframes shimmer {
      0%   { left: -60%; }
      60%  { left: 120%; }
      100% { left: 120%; }
    }
    .cta:hover {
      background: var(--accent-h);
      box-shadow: 0 10px 50px var(--accent-g);
      transform: translateY(-2px);
    }
    .cta:active { transform: translateY(0); }
    .cta-arrow { width: 15px; height: 15px; transition: transform 0.2s var(--ease); flex-shrink: 0; }
    .cta:hover .cta-arrow { transform: translateX(5px); }

    /* ── Footer ──────────────────────────────────────────────────────── */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      text-align: center; padding: 13px 24px;
      background: var(--bar-bg); border-top: 1px solid var(--bar-b);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
      animation: fade-up 0.5s var(--ease) 2s both;
    }
    footer p {
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      color: var(--foot-txt); transition: color var(--t) var(--ease);
    }
    footer p .heart { color: #e11d48; }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg fill="none" viewBox="0 0 24 24">
          <path d="M12 2L3 7V12C3 17.52 6.84 22.74 12 24C17.16 22.74 21 17.52 21 12V7L12 2Z"
            fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="11.5" r="2.6" fill="#fff"/>
          <path d="M8 8.5L12 11.5M16 8.5L12 11.5M12 11.5V16.5"
            stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">Universal ML Studio</span>
    </div>

    <div class="toggle-row">
      <span class="toggle-label" id="tog-lbl">Dark</span>
      <button class="toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Switch theme">
        <div class="tog-track">
          <div class="tog-thumb">
            <svg class="i-moon" fill="none" stroke="#fff" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg class="i-sun" fill="none" stroke="#fff" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </div>
        </div>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="page">
    <div class="card">

      <!-- Animated glyph with rings -->
      <div class="glyph-wrap">
        <div class="glyph-ring-2"></div>
        <div class="glyph-ring"></div>
        <div class="glyph">
          <svg fill="none" viewBox="0 0 24 24">
            <path d="M12 2L3 7V12C3 17.52 6.84 22.74 12 24C17.16 22.74 21 17.52 21 12V7L12 2Z"
              fill="rgba(255,255,255,0.20)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="11.5" r="2.8" fill="#fff"/>
            <circle cx="8"  cy="8.5"  r="1.3" fill="#67e8f9"/>
            <circle cx="16" cy="8.5"  r="1.3" fill="#c0c1ff"/>
            <circle cx="12" cy="16.5" r="1.3" fill="#6ee7b7"/>
            <path d="M8 8.5L12 11.5M16 8.5L12 11.5M12 11.5V16.5"
              stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Live status -->
      <div class="status-badge">
        <span class="status-dot-anim"></span>
        Platform Active
      </div>

      <!-- Title with word-by-word reveal -->
      <h1 class="title">
        <span class="word"><span>Universal</span></span>&nbsp;
        <span class="word"><span>AI/ML</span></span>&nbsp;
        <span class="word"><span>Studio</span></span>
      </h1>

      <!-- Subtitle -->
      <p class="sub">Your end-to-end machine learning workspace —<br>from raw data to audited, production-ready models.</p>

      <!-- Real stat chips -->
      <div class="chips">
        <div class="chip">
          <span class="chip-num">7</span> Built-in Datasets
        </div>
        <div class="chip">
          <span class="chip-num">11</span> EDA Analysis Tabs
        </div>
        <div class="chip">
          <span class="chip-num">30+</span> Quality Checks
        </div>
      </div>

      <div class="divider"></div>

      <!-- CTA -->
      <div class="cta-wrap">
        <a href="/dashboard" class="cta">
          Let's Get Started
          <svg class="cta-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Crafted with <span class="heart">♥</span> by Keerthi &amp; Jayakrushna</p>
  </footer>

  <script>
    // Shares exact same localStorage key as main app — always in sync
    const KEY = 'studio_theme';

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(KEY, t);
      document.getElementById('tog-lbl').textContent = t === 'dark' ? 'Dark' : 'Light';
    }

    function toggleTheme() {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    // Instant apply — no flash
    applyTheme(localStorage.getItem(KEY) || 'dark');
  </script>
</body>
</html>
