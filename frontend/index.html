<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Audit — Evidence-Driven Pipeline Auditor</title>
    <meta name="description" content="Detect data leakage, audit ML evaluation integrity, and automatically repair machine learning pipelines.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">ML Auditor</div>
                <div class="brand-sub">Evidence-Driven Framework</div>
            </div>
        </div>

        <div class="nav-section-label">Overview</div>
        <nav class="sidebar-nav">
            <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a class="nav-item" data-page="datasets" onclick="navigate('datasets')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
                <span>Datasets</span>
            </a>
        </nav>

        <div class="nav-section-label">Experiment</div>
        <nav class="sidebar-nav">
            <a class="nav-item" data-page="experiment" onclick="navigate('experiment')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 3h6v11l3 4H6l3-4z"/><line x1="6" y1="21" x2="18" y2="21"/>
                </svg>
                <span>New Experiment</span>
            </a>
            <a class="nav-item" data-page="findings" onclick="navigate('findings')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
                <span>Audit Findings</span>
                <span class="nav-badge" id="findingsBadge" style="display:none">0</span>
            </a>
            <a class="nav-item" data-page="comparison" onclick="navigate('comparison')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
                </svg>
                <span>Before / After</span>
            </a>
        </nav>

        <div class="nav-section-label">Tools</div>
        <nav class="sidebar-nav">
            <a class="nav-item" data-page="benchmark" onclick="navigate('benchmark')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="4"/>
                    <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
                    <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
                </svg>
                <span>Benchmark Lab</span>
            </a>
            <a class="nav-item" data-page="reports" onclick="navigate('reports')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    <line x1="10" y1="9" x2="8" y2="9"/>
                </svg>
                <span>Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="status-dot"></div>
            <span>Server running</span>
        </div>
    </aside>

    <!-- Main content -->
    <div class="layout-wrapper">
        <main class="main-content" id="mainContent">
            <div id="page-dashboard"  class="page active"></div>
            <div id="page-datasets"   class="page"></div>
            <div id="page-experiment" class="page"></div>
            <div id="page-findings"   class="page"></div>
            <div id="page-comparison" class="page"></div>
            <div id="page-benchmark"  class="page"></div>
            <div id="page-reports"    class="page"></div>
        </main>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Processing…</p>
        </div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/app.js"></script>
</body>
</html>
